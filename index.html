<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Калькулятор Ozon — выбор категории</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Параметры товара</h1>

    <div class="selector-block">
      <label class="selector-label">Категория</label>

      <!-- Readonly trigger, как у Ozon -->
      <button id="trigger" class="trigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="triggerText" class="trigger-text">Выберите тип товара</span>
        <span class="trigger-caret" aria-hidden="true">▾</span>
      </button>

      <!-- Панель со строкой поиска и списком -->
      <div id="panel" class="panel" role="dialog" aria-modal="false">
        <div class="panel-search">
          <span class="icon">🔍</span>
          <input id="searchInput" type="text" placeholder="Введите категорию" autocomplete="off" />
        </div>
        <div id="list" class="list" role="listbox" aria-labelledby="trigger"></div>
        <div id="empty" class="empty" hidden>Ничего не найдено</div>
      </div>

      <p class="hint" id="selectionHint">Выберите тип товара из списка.</p>
      <div class="commission" id="commissionBox" hidden>
        <span>Вознаграждение Ozon: </span>
        <strong>FBO — <span id="fboVal">—</span>%, FBS — <span id="fbsVal">—</span>%</strong>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

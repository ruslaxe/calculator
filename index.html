<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Калькулятор Ozon — выбор категории</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Параметры товара</h1>

    <div class="selector-block">
      <label for="categoryTypeInput" class="selector-label">Категория</label>
      <div class="combo" id="combo">
        <input id="categoryTypeInput" class="combo-input" type="text" placeholder="Введите категорию или тип" autocomplete="off" aria-expanded="false" aria-controls="combo-list" />
        <button class="combo-caret" aria-label="Открыть список" id="toggleBtn">▾</button>
        <div class="combo-list" id="combo-list" role="listbox"></div>
      </div>
      <p class="hint" id="selectionHint">Выберите тип товара из списка ниже.</p>
      <div class="commission" id="commissionBox" hidden>
        <span>Вознаграждение Ozon: </span>
        <strong>FBO — <span id="fboVal">—</span>%, FBS — <span id="fbsVal">—</span>%</strong>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
